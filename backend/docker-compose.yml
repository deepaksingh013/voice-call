services:
  postgres:
    image: postgres:16-alpine
    container_name: voiceonly-postgres
    environment:
      POSTGRES_USER: voiceonly
      POSTGRES_PASSWORD: voiceonly
      POSTGRES_DB: voiceonly
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceonly"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: voiceonly-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
