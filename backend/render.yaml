# Render blueprint for the Voice-Only backend.
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo and
# set the root directory to `backend`.
#
# Everything except CORS_ORIGIN and JWT_SECRET is wired up automatically.
# JWT_SECRET is generated by Render; CORS_ORIGIN has to be your frontend's
# real URL, so it is left for you to fill in.

databases:
  - name: voiceonly-db
    databaseName: voiceonly
    user: voiceonly
    plan: free

services:
  # ---------------------------------------------------------------- API ----
  - type: web
    name: voiceonly-api
    runtime: node
    plan: free
    rootDir: backend
    # `migrate deploy` applies committed migrations without prompting, which
    # is the only safe thing to run against a live database.
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voiceonly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voiceonly-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_TOKEN_TTL_DAYS
        value: "365"
      - key: SESSION_TTL_DAYS
        value: "30"
      # Comma-separated allowlist. Replace with your frontend URL — the API
      # sends credentials, so this cannot be a wildcard.
      - key: CORS_ORIGIN
        sync: false
      - key: VOICE_SERVICE_URL
        fromService:
          type: web
          name: voiceonly-voice
          property: hostport
      - key: VOICE_CONFIDENCE_THRESHOLD
        value: "0.90"

  # ------------------------------------------------- voice classifier ----
  # Optional. If this is not deployed, guests simply stay "unknown" and keep
  # matching in the general pool — the API degrades rather than failing.
  - type: web
    name: voiceonly-voice
    runtime: python
    plan: free
    rootDir: backend/voice-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  # --------------------------------------------------------------- redis ----
  - type: keyvalue
    name: voiceonly-redis
    plan: free
    # Only the API talks to it, and both live inside Render's private network.
    ipAllowList: []
